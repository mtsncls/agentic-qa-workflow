name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: 0 3 * * * # nightly 03:00 UTC

permissions:
  contents: read

env:
  STANDARD_USER: standard_user
  COMMON_PASSWORD: secret_sauce

jobs:
  quality-gate:
    name: Lint + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  e2e-chromium:
    name: E2E (chromium)
    runs-on: ubuntu-latest
    needs: quality-gate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium --with-deps

      - name: Run Playwright suite (chromium)
        env:
          ARTIFACTS_DIR: artifacts/ci
        run: npx playwright test --project=chromium

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-artifacts-chromium
          path: |
            artifacts/
            allure-results/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  nightly-matrix:
    name: Nightly (${{ matrix.browser }})
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: quality-gate
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install ${{ matrix.browser }} --with-deps

      - name: Run Playwright suite (${{ matrix.browser }})
        env:
          PW_PROJECTS: chromium,firefox
          ARTIFACTS_DIR: artifacts/nightly-${{ matrix.browser }}
        run: npx playwright test --project=${{ matrix.browser }}

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-artifacts-nightly-${{ matrix.browser }}
          path: |
            artifacts/
            allure-results/
            test-results/
          retention-days: 14
          if-no-files-found: ignore

  agentic-pipeline-smoke:
    name: Smoke pipeline agéntico (mock Jira + dry-run)
    runs-on: ubuntu-latest
    needs: quality-gate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium --with-deps

      # Full pipeline without credentials: deterministic planner/analyst and mocked Jira.
      # For real mode: define ANTHROPIC_API_KEY, JIRA_* secrets and remove MOCK_JIRA/DRY_RUN.
      - name: Run pipeline (MOCK_JIRA + DRY_RUN)
        env:
          MOCK_JIRA: "1"
          DRY_RUN: "1"
        run: npm run qa -- run -t QA-101

      - name: Upload run manifest
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: agentic-run-manifest
          path: artifacts/pipeline-QA-101-*/manifest.json
          retention-days: 30
          if-no-files-found: ignore
