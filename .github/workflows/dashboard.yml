name: Quality dashboard

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read

concurrency:
  group: dashboard-${{ github.ref }}
  cancel-in-progress: false

jobs:
  aggregate-and-deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      # Deploys the committed reporting/metrics-history.json. `npm run report`
      # merges it with any manifest.json present under artifacts/ (e.g. from a
      # real pipeline run downloaded as a CI artifact) on a last-write-wins
      # basis, so the committed history stays the source of truth. No smoke
      # run is generated here.
      - name: Aggregate metrics
        run: npm run report

      - name: Commit updated history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reporting/metrics-history.json
          git diff --cached --quiet || git commit -m "chore: update quality metrics history [skip ci]"
          git push

      # ── Allure report (from the CI run's test artifacts) ───────────────
      - name: Download Allure results from CI run
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ github.event.workflow_run.id }}
          name: playwright-artifacts-chromium
          path: allure-download
          if-no-files-found: ignore

      - name: Set up Java (Allure CLI needs a JRE)
        if: ${{ hashFiles('allure-download/allure-results/*.json') != '' }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Generate Allure report
        if: ${{ hashFiles('allure-download/allure-results/*.json') != '' }}
        run: npx --yes allure-commandline generate allure-download/allure-results -o allure-report --clean

      - name: Assemble dashboard for Pages
        run: |
          mkdir -p _site
          cp -r dashboard/* _site/
          cp reporting/metrics-history.json _site/metrics-history.json
          if [ -d allure-report ]; then
            mkdir -p _site/allure
            cp -r allure-report/* _site/allure/
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - uses: actions/deploy-pages@v4
