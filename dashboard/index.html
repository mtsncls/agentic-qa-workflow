<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Agentic QA Workflow Dashboard - Real-time test performance and decision metrics">
<title>Agentic QA Dashboard</title>
<style>
:root {
  --primary-color: #3b82f6;
  --success-color: #10b981;
  --danger-color: #ef4444;
  --warning-color: #f59e0b;
  --info-color: #6366f1;
  --background: #0f172a;
  --card-bg: #1e293b;
  --text-primary: #f8fafc;
  --text-secondary: #94a3b8;
  --border-radius: 8px;
  --box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
  --transition: all 0.3s ease;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background-color: var(--background);
  color: var(--text-primary);
  line-height: 1.6;
}

.container {
  max-width: 1400px;
  margin: 0 auto;
  padding: 20px;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 30px;
  padding-bottom: 20px;
  border-bottom: 1px solid #334155;
}

.title {
  font-size: 2.5rem;
  font-weight: 700;
  background: linear-gradient(90deg, var(--primary-color), var(--success-color));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.subtitle {
  font-size: 1rem;
  color: var(--text-secondary);
  margin-top: 5px;
}

.card {
  background: var(--card-bg);
  border-radius: var(--border-radius);
  padding: 20px;
  margin-bottom: 20px;
  box-shadow: var(--box-shadow);
  transition: var(--transition);
}

.card:hover {
  transform: translateY(-2px);
  box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
}

.card-title {
  font-size: 1.3rem;
  margin-bottom: 15px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.card-title i {
  color: var(--primary-color);
}

.kpi-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 15px;
  margin-bottom: 20px;
}

.kpi-card {
  background: rgba(30, 41, 59, 0.7);
  border-radius: var(--border-radius);
  padding: 15px;
  text-align: center;
  transition: var(--transition);
}

.kpi-card:hover {
  transform: scale(1.02);
  background: rgba(30, 41, 59, 0.9);
}

.kpi-value {
  font-size: 2rem;
  font-weight: 700;
  margin: 10px 0;
}

.kpi-label {
  font-size: 0.9rem;
  color: var(--text-secondary);
}

.kpi-trend {
  font-size: 1.2rem;
  margin-left: 5px;
}

.trend-up {
  color: var(--success-color);
}

.trend-down {
  color: var(--danger-color);
}

.chart-container {
  height: 250px;
  margin-bottom: 20px;
  position: relative;
  max-width: 100%;
  overflow: hidden;
  min-width: 0; /* Prevents container from expanding beyond available space */
}

/* Ensure charts respect container dimensions */
canvas {
  max-width: 100% !important;
  height: auto !important;
  width: 100% !important;
  max-height: 100% !important;
}

.table-container {
  overflow-x: auto;
}

table {
  width: 100%;
  border-collapse: collapse;
  margin: 15px 0;
}

th, td {
  padding: 12px 15px;
  text-align: left;
  border-bottom: 1px solid #334155;
}

th {
  background-color: rgba(56, 73, 90, 0.5);
  font-weight: 600;
  color: var(--text-secondary);
}

tr:hover {
  background-color: rgba(56, 73, 90, 0.2);
}

.badge {
  padding: 4px 8px;
  border-radius: 12px;
  font-size: 0.8rem;
  font-weight: 500;
  display: inline-block;
  margin: 2px;
}

.badge-bug {
  background-color: rgba(239, 68, 68, 0.2);
  color: #ef4444;
}

.badge-flaky {
  background-color: rgba(245, 158, 11, 0.2);
  color: #f59e0b;
}

.badge-ok {
  background-color: rgba(16, 185, 129, 0.2);
  color: #10b981;
}

.badge-retry {
  background-color: rgba(245, 158, 11, 0.2);
  color: #f59e0b;
}

.badge-comment {
  background-color: rgba(59, 130, 246, 0.2);
  color: #3b82f6;
}

.badge-escalate {
  background-color: rgba(168, 85, 247, 0.2);
  color: #a855f7;
}

.empty-state {
  text-align: center;
  padding: 40px;
  color: var(--text-secondary);
}

.empty-state i {
  font-size: 3rem;
  margin-bottom: 15px;
  display: block;
  color: #64748b;
}

.empty-state p {
  font-size: 1.1rem;
}

.btn {
  background-color: var(--primary-color);
  color: white;
  border: none;
  padding: 10px 20px;
  border-radius: var(--border-radius);
  cursor: pointer;
  font-weight: 600;
  transition: var(--transition);
  text-decoration: none;
  display: inline-block;
}

.btn:hover {
  background-color: #2563eb;
  transform: translateY(-2px);
}

.btn-outline {
  background: transparent;
  border: 1px solid var(--primary-color);
}

.btn-outline:hover {
  background-color: rgba(59, 130, 246, 0.1);
}

.grid-2 {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(600px, 1fr));
  gap: 20px;
  margin-bottom: 20px;
}

@media (max-width: 768px) {
  .grid-2 {
    grid-template-columns: 1fr;
  }
  
  .kpi-grid {
    grid-template-columns: repeat(2, 1fr);
  }
  
  .header {
    flex-direction: column;
    align-items: flex-start;
    gap: 15px;
  }
}

/* Theme toggle */
.theme-toggle {
  background: none;
  border: none;
  color: var(--text-primary);
  cursor: pointer;
  padding: 8px;
  border-radius: var(--border-radius);
  transition: var(--transition);
}

.theme-toggle:hover {
  background-color: rgba(56, 73, 90, 0.2);
}

/* Chart tooltips */
.chart-tooltip {
  position: absolute;
  background: rgba(15, 23, 42, 0.9);
  border: 1px solid #334155;
  border-radius: var(--border-radius);
  padding: 10px;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.3s ease;
  backdrop-filter: blur(4px);
  z-index: 1000;
  max-width: 300px;
}

.chart-tooltip.show {
  opacity: 1;
}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div>
      <h1 class="title">Agentic QA Dashboard</h1>
      <p class="subtitle">Real-time test performance and automated decision metrics</p>
    </div>
    <button id="theme-toggle" class="theme-toggle" onclick="toggleTheme()">
      🌙 Dark
    </button>
  </div>

  <div id="content">
    <div class="empty-state">
      <i>📊</i>
      <h2>Loading dashboard data...</h2>
      <p>Run <code>npm run report</code> to populate dashboard metrics</p>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
function toggleTheme() {
  const html = document.documentElement;
  const next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  html.setAttribute('data-theme', next);
  
  const btn = document.getElementById('theme-toggle');
  btn.textContent = next === 'dark' ? '🌙 Dark' : '☀️ Light';
}

function fmtDate(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  if (isNaN(d)) return '—';
  return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: '2-digit' });
}

function pct(n, d) { 
  return d ? Math.round((n / d) * 100) : 0; 
}

async function loadHistory() {
  const candidates = ['./metrics-history.json', '../reporting/metrics-history.json', './reporting/metrics-history.json'];
  for (const url of candidates) {
    try {
      const res = await fetch(url, { cache: 'no-store' });
      if (res.ok) return await res.json();
    } catch (e) { /* try next */ }
  }
  return null;
}

async function loadUreport() {
  const candidates = ['./ureport-history.json', '../reporting/ureport-history.json', './reporting/ureport-history.json'];
  for (const url of candidates) {
    try {
      const res = await fetch(url, { cache: 'no-store' });
      if (res.ok) return await res.json();
    } catch (e) { /* try next */ }
  }
  return null;
}

async function loadUreportSnapshot() {
  const candidates = ['./ureport-snapshot.json', '../reporting/ureport-snapshot.json', './reporting/ureport-snapshot.json'];
  for (const url of candidates) {
    try {
      const res = await fetch(url, { cache: 'no-store' });
      if (res.ok) return await res.json();
    } catch (e) { /* try next */ }
  }
  return null;
}

function renderEmpty() {
  document.getElementById('content').innerHTML =
    '<div class="empty-state">' +
    '<i>📊</i>' +
    '<h2>No runs yet</h2>' +
    '<p>Run <code>npm run report</code> after a pipeline run to populate reporting/metrics-history.json.</p>' +
    '<a href="#" onclick="location.reload()" class="btn">Refresh</a>' +
    '</div>';
}

function renderKpis(history) {
  const totals = history.reduce((acc, r) => {
    acc.total += r.tests.total || 0;
    acc.passed += r.tests.passed || 0;
    acc.failed += r.tests.failed || 0;
    acc.flaky += r.tests.flaky || 0;
    acc.bugs += r.bugsCreated || 0;
    acc.decisions += r.decisions?.total || 0;
    return acc;
  }, { total: 0, passed: 0, failed: 0, flaky: 0, bugs: 0, decisions: 0 });

  const confidences = history.map(r => r.avgConfidence).filter(c => c != null && !isNaN(c));
  const avgConf = confidences.length ? (confidences.reduce((a, b) => a + b, 0) / confidences.length) : null;

  const kpis = [
    { label: 'Total Runs', value: history.length, trend: null },
    { label: 'Pass Rate', value: pct(totals.passed, totals.total) + '%', sub: totals.passed + '/' + totals.total + ' tests', trend: '↗' },
    { label: 'Flaky Rate', value: pct(totals.flaky, totals.total) + '%', sub: totals.flaky + ' flaky tests', trend: '→' },
    { label: 'Bugs Auto-Created', value: totals.bugs, sub: totals.decisions + ' decisions made', trend: '↗' },
    { label: 'Avg Analyst Confidence', value: avgConf != null ? avgConf.toFixed(2) : '—', trend: null },
  ];

  document.getElementById('content').innerHTML = `
    <div class="kpi-grid">
      ${kpis.map(k =>
        '<div class="kpi-card">' +
        (k.trend ? '<div class="kpi-trend"><span class="trend-up">' + k.trend + '</span></div>' : '') +
        '<div class="kpi-label">' + k.label + '</div>' +
        '<div class="kpi-value">' + k.value + '</div>' +
        (k.sub ? '<div class="kpi-sub">' + k.sub + '</div>' : '') +
        '</div>'
      ).join('')}
    </div>
    
    <div class="grid-2">
      <div class="card">
        <h2 class="card-title">Test Outcomes</h2>
        <canvas id="overviewChart"></canvas>
      </div>
      
      <div class="card">
        <h2 class="card-title">Decision Actions Overview</h2>
        <canvas id="decisionOverviewChart"></canvas>
      </div>
    </div>
    
    <div class="grid-2">
      <div class="card">
        <h2 class="card-title">Test Results Over Time</h2>
        <canvas id="testsTrendChart"></canvas>
      </div>
      
      <div class="card">
        <h2 class="card-title">Analyst Confidence Trend</h2>
        <canvas id="confidenceChart"></canvas>
      </div>
    </div>
    
    <div class="grid-2">
      <div class="card">
        <h2 class="card-title">Failure Classification</h2>
        <canvas id="classificationChart"></canvas>
      </div>
      
      <div class="card">
        <h2 class="card-title">Decision Actions by Type</h2>
        <canvas id="actionsChart"></canvas>
      </div>
    </div>
    
    <div class="card">
      <h2 class="card-title">Recent Pipeline Runs</h2>
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>Ticket</th>
              <th>Date</th>
              <th>Tests</th>
              <th>Coverage</th>
              <th>Decisions</th>
              <th>Bugs</th>
              <th>Avg Conf</th>
            </tr>
          </thead>
          <tbody id="runsTable"></tbody>
        </table>
      </div>
    </div>
    
    <div class="card">
      <h2 class="card-title">Business Risk Metrics</h2>
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>Risk Tag</th>
              <th>Coverage</th>
              <th>Tests</th>
              <th>Bugs</th>
              <th>Avg Conf</th>
            </tr>
          </thead>
          <tbody id="riskTable"></tbody>
        </table>
      </div>
    </div>
  `;

  // Render overview donuts
  const ctxOverview = document.getElementById('overviewChart');
  new Chart(ctxOverview, {
    type: 'doughnut',
    data: {
      labels: ['Passed', 'Failed', 'Flaky'],
      datasets: [{
        data: [totals.passed, totals.failed, totals.flaky],
        backgroundColor: ['#10b981', '#ef4444', '#f59e0b'],
        borderWidth: 2,
        borderColor: getComputedStyle(document.documentElement).getPropertyValue('--card-bg').trim()
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      cutout: '65%',
      plugins: {
        legend: {
          position: 'bottom',
          labels: {
            color: getComputedStyle(document.documentElement).getPropertyValue('--text-secondary').trim(),
            padding: 12,
            usePointStyle: true,
            font: { size: 11 }
          }
        },
        tooltip: {
          callbacks: {
            label: function(context) {
              const total = context.dataset.data.reduce((a, b) => a + b, 0);
              const percentage = ((context.raw / total) * 100).toFixed(1);
              return `${context.label}: ${context.raw} (${percentage}%)`;
            }
          }
        }
      },
      // Set explicit chart dimensions with tight constraints
      layout: {
        padding: 10
      },
      aspectRatio: 1.0, // Square ratio for doughnut charts to prevent oversized rendering
      // Limit the rendering area to prevent memory issues
      animation: {
        duration: 0
      }
    }
  });

  // Decision overview
  const decisionTotals = { retry: 0, create_bug: 0, comment: 0, escalate: 0, none: 0 };
  history.forEach(r => {
    if (r.decisions?.byAction) {
      decisionTotals.retry += r.decisions.byAction.retry || 0;
      decisionTotals.create_bug += r.decisions.byAction.create_bug || 0;
      decisionTotals.comment += r.decisions.byAction.comment || 0;
      decisionTotals.escalate += r.decisions.byAction.escalate || 0;
      decisionTotals.none += r.decisions.byAction.none || 0;
    }
  });
  const ctxDecision = document.getElementById('decisionOverviewChart');
  new Chart(ctxDecision, {
    type: 'doughnut',
    data: {
      labels: ['Retry', 'Bug Created', 'Comment', 'Escalate', 'None'],
      datasets: [{
        data: [decisionTotals.retry, decisionTotals.create_bug, decisionTotals.comment, decisionTotals.escalate, decisionTotals.none],
        backgroundColor: ['#f59e0b', '#ef4444', '#3b82f6', '#a855f7', '#64748b'],
        borderWidth: 2,
        borderColor: getComputedStyle(document.documentElement).getPropertyValue('--card-bg').trim()
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      cutout: '65%',
      plugins: {
        legend: {
          position: 'bottom',
          labels: {
            color: getComputedStyle(document.documentElement).getPropertyValue('--text-secondary').trim(),
            padding: 12,
            usePointStyle: true,
            font: { size: 11 }
          }
        },
        tooltip: {
          callbacks: {
            label: function(context) {
              const total = context.dataset.data.reduce((a, b) => a + b, 0);
              const percentage = ((context.raw / total) * 100).toFixed(1);
              return `${context.label}: ${context.raw} (${percentage}%)`;
            }
          }
        }
      },
      // Set explicit chart dimensions with tight constraints
      layout: {
        padding: 10
      },
      aspectRatio: 1.0, // Square ratio for doughnut charts to prevent oversized rendering
      // Limit the rendering area to prevent memory issues
      animation: {
        duration: 0
      }
    }
  });

  // Test results over time
  const ctxTestsTrend = document.getElementById('testsTrendChart');
  new Chart(ctxTestsTrend, {
    type: 'line',
    data: {
      labels: history.map(r => fmtDate(r.startedAt)),
      datasets: [
        { 
          label: 'Passed', 
          data: history.map(r => r.tests.passed || 0), 
          borderColor: '#10b981', 
          backgroundColor: 'rgba(16, 185, 129, 0.1)',
          fill: true,
          tension: 0.4,
          pointRadius: 3
        },
        { 
          label: 'Failed', 
          data: history.map(r => r.tests.failed || 0), 
          borderColor: '#ef4444', 
          backgroundColor: 'rgba(239, 68, 68, 0.1)',
          fill: true,
          tension: 0.4,
          pointRadius: 3
        },
        { 
          label: 'Flaky', 
          data: history.map(r => r.tests.flaky || 0), 
          borderColor: '#f59e0b', 
          backgroundColor: 'rgba(245, 158, 11, 0.1)',
          fill: true,
          tension: 0.4,
          pointRadius: 3
        }
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      scales: { 
        x: { 
          grid: { display: false }, 
          ticks: { 
            color: getComputedStyle(document.documentElement).getPropertyValue('--text-secondary').trim(),
            maxRotation: 45,
            minRotation: 45
          } 
        }, 
        y: { 
          beginAtZero: true, 
          ticks: { 
            precision: 0, 
            color: getComputedStyle(document.documentElement).getPropertyValue('--text-secondary').trim() 
          },
          grid: { color: 'rgba(148, 163, 184, 0.1)' } 
        } 
      },
      plugins: { 
        legend: { 
          position: 'top',
          labels: { 
            color: getComputedStyle(document.documentElement).getPropertyValue('--text-secondary').trim(), 
            usePointStyle: true, 
            padding: 16 
          } 
        },
        tooltip: {
          mode: 'index',
          intersect: false
        }
      },
      // Set chart dimensions with explicit limits
      responsive: true,
      maintainAspectRatio: true,
      aspectRatio: 2.5,
      // Limit maximum canvas size for performance
      animation: {
        duration: 0 // Disable animations for better performance
      }
    }
  });

  // Confidence trend chart
  const withConf = history.filter(r => r.avgConfidence != null && !isNaN(r.avgConfidence));
  const ctxConfidence = document.getElementById('confidenceChart');
  new Chart(ctxConfidence, {
    type: 'line',
    data: {
      labels: withConf.map(r => fmtDate(r.startedAt)),
      datasets: [{
        label: 'Avg confidence',
        data: withConf.map(r => r.avgConfidence),
        borderColor: '#3b82f6',
        backgroundColor: 'rgba(59, 130, 246, 0.1)',
        fill: true,
        tension: 0.4,
        pointRadius: 4,
        pointBackgroundColor: '#3b82f6',
        pointBorderColor: '#ffffff',
        pointBorderWidth: 2,
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      scales: { 
        y: { 
          min: 0, 
          max: 1, 
          grid: { color: 'rgba(148, 163, 184, 0.1)' }, 
          ticks: { 
            color: getComputedStyle(document.documentElement).getPropertyValue('--text-secondary').trim(), 
            stepSize: 0.2 
          } 
        }, 
        x: { 
          grid: { display: false }, 
          ticks: { 
            color: getComputedStyle(document.documentElement).getPropertyValue('--text-secondary').trim(),
            maxRotation: 45,
            minRotation: 45
          } 
        } 
      },
      plugins: { 
        legend: { 
          display: false 
        },
        tooltip: {
          callbacks: {
            label: function(context) {
              return `Confidence: ${context.parsed.y.toFixed(2)}`;
            }
          }
        }
      },
      // Set chart dimensions with explicit limits
      responsive: true,
      maintainAspectRatio: true,
      aspectRatio: 2.5,
      // Limit maximum canvas size for performance
      animation: {
        duration: 0 // Disable animations for better performance
      }
    }
  });

  // Classification chart
  const classificationTotals = { product_bug: 0, flaky: 0, test_issue: 0, environment: 0 };
  history.forEach(r => { 
    if (r.classifications) for (const k in classificationTotals) {
      classificationTotals[k] += (r.classifications[k] || 0); 
    }
  });
  
  const ctxClassification = document.getElementById('classificationChart');
  new Chart(ctxClassification, {
    type: 'bar',
    data: {
      labels: ['Product Bug', 'Flaky', 'Test Issue', 'Environment'],
      datasets: [{
        data: [classificationTotals.product_bug, classificationTotals.flaky, classificationTotals.test_issue, classificationTotals.environment],
        backgroundColor: ['#ef4444', '#f59e0b', '#3b82f6', '#a855f7'],
        borderRadius: 6
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      scales: { 
        y: { 
          beginAtZero: true, 
          ticks: { precision: 0 }, 
          grid: { color: 'rgba(148, 163, 184, 0.1)' } 
        }, 
        x: { 
          grid: { display: false }, 
          ticks: { color: getComputedStyle(document.documentElement).getPropertyValue('--text-secondary').trim() } 
        } 
      },
      plugins: { 
        legend: { 
          display: false 
        },
        tooltip: {
          callbacks: {
            label: function(context) {
              const total = context.dataset.data.reduce((a, b) => a + b, 0);
              const percentage = ((context.raw / total) * 100).toFixed(1);
              return `${context.dataset.label}: ${context.raw} (${percentage}%)`;
            }
          }
        }
      },
      // Set chart dimensions with explicit limits
      responsive: true,
      maintainAspectRatio: true,
      aspectRatio: 1.8,
      // Limit maximum canvas size for performance
      animation: {
        duration: 0 // Disable animations for better performance
      }
    }
  });

  // Actions chart
  const ctxActions = document.getElementById('actionsChart');
  new Chart(ctxActions, {
    type: 'bar',
    data: {
      labels: ['Retry', 'Bug Created', 'Comment', 'Escalate', 'No Action'],
      datasets: [{
        data: [decisionTotals.retry, decisionTotals.create_bug, decisionTotals.comment, decisionTotals.escalate, decisionTotals.none],
        backgroundColor: ['#f59e0b', '#ef4444', '#3b82f6', '#a855f7', '#64748b'],
        borderRadius: 6
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      scales: { 
        y: { 
          beginAtZero: true, 
          ticks: { precision: 0 }, 
          grid: { color: 'rgba(148, 163, 184, 0.1)' } 
        }, 
        x: { 
          grid: { display: false }, 
          ticks: { color: getComputedStyle(document.documentElement).getPropertyValue('--text-secondary').trim() } 
        } 
      },
      plugins: { 
        legend: { 
          display: false 
        },
        tooltip: {
          callbacks: {
            label: function(context) {
              const total = context.dataset.data.reduce((a, b) => a + b, 0);
              const percentage = ((context.raw / total) * 100).toFixed(1);
              return `${context.dataset.label}: ${context.raw} (${percentage}%)`;
            }
          }
        }
      },
      // Set chart dimensions with explicit limits
      responsive: true,
      maintainAspectRatio: true,
      aspectRatio: 1.8,
      // Limit maximum canvas size for performance
      animation: {
        duration: 0 // Disable animations for better performance
      }
    }
  });

  // Render recent runs table
  const runsTable = document.getElementById('runsTable');
  const rows = [...history].reverse().slice(0, 10).map(r => {
    const badges = [];
    if (r.bugsCreated) badges.push('<span class="badge badge-bug">' + r.bugsCreated + ' bug' + (r.bugsCreated > 1 ? 's' : '') + '</span>');
    if (r.classifications?.flaky) badges.push('<span class="badge badge-flaky">' + r.classifications.flaky + ' flaky</span>');
    if (!r.bugsCreated && !r.classifications?.flaky && (r.tests?.failed || 0) === 0) badges.push('<span class="badge badge-ok">clean</span>');
    
    return '<tr>' +
      '<td><a href="' + (r.issueUrl || '#') + '" target="_blank" rel="noopener">' + r.ticket + '</a></td>' +
      '<td>' + fmtDate(r.startedAt) + '</td>' +
      '<td>' + (r.tests?.passed || 0) + '/' + (r.tests?.total || 0) + '</td>' +
      '<td>' + (r.coverage?.covered || 0) + '/' + (r.coverage?.total || 0) + '</td>' +
      '<td>' + (r.decisions?.total || 0) + ' ' + badges.join(' ') + '</td>' +
      '<td>' + (r.bugsCreated || 0) + '</td>' +
      '<td>' + (r.avgConfidence != null ? r.avgConfidence.toFixed(2) : '—') + '</td>' +
      '</tr>';
  });
  runsTable.innerHTML = rows.join('') || '<tr><td colspan="7">No runs yet.</td></tr>';

  // Render risk table
  const riskTable = document.getElementById('riskTable');
  const riskData = {};
  
  history.forEach(r => {
    if (r.risk) {
      for (const [tag, m] of Object.entries(r.risk)) {
        const existing = riskData[tag];
        if (!existing) {
          riskData[tag] = { ...m };
        } else {
          // Aggregate values
          existing.criteria += m.criteria;
          existing.covered += m.covered;
          existing.failed += m.failed;
          existing.passed += m.passed;
          existing.flaky += m.flaky;
          existing.bugs += m.bugs;
          if (m.avgConfidence != null && !isNaN(m.avgConfidence)) {
            // Simple average for confidence
            if (existing.confCount) {
              existing.confSum += m.avgConfidence;
              existing.confCount += 1;
            } else {
              existing.confSum = m.avgConfidence;
              existing.confCount = 1;
            }
          }
        }
      }
    }
  });

  const riskRows = Object.keys(riskData).sort().map(tag => {
    const r = riskData[tag];
    const conf = r.confCount ? (r.confSum / r.confCount).toFixed(2) : '—';
    return '<tr>' +
      '<td><strong>' + tag + '</strong></td>' +
      '<td>' + r.covered + '/' + r.criteria + '</td>' +
      '<td>' + r.passed + '/' + r.failed + '/' + r.flaky + '</td>' +
      '<td>' + r.bugs + '</td>' +
      '<td>' + conf + '</td>' +
      '</tr>';
  });
  
  riskTable.innerHTML = riskRows.join('') || '<tr><td colspan="5">No tagged runs yet.</td></tr>';
}

(async function init() {
  const history = await loadHistory();
  if (!history || !history.length) { 
    renderEmpty(); 
  } else {
    renderKpis(history);
  }
})();

  // Ensure chart containers have strict constraints and prevent memory leaks
  document.querySelectorAll('.chart-container').forEach(container => {
    const canvas = container.querySelector('canvas');
    if (canvas) {
      // Set explicit dimensions for the canvas in the context
      canvas.style.width = '100%';
      canvas.style.height = '100%';
    }
  });
</script>
</body>
</html>
